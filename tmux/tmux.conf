# dev_env tmux configuration
# 从 0 设计，目标兼容 tmux 3.4+。
# 本地覆盖：~/.tmux.local.conf（默认不存在；可参考 tmux/local.conf.example）。

# ---------- terminal / rendering ----------
# tmux-256color 不一定在所有系统都有；没有时回退到 screen-256color。
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'

set -as terminal-features ',*:RGB'
set -as terminal-features ',*:focus'
set -g focus-events on
set -sg escape-time 10

# ---------- behaviour ----------
set -g mouse on
set -g history-limit 100000
# 复制/粘贴暂不配置；后续单独章节统一处理。

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g repeat-time 500

setw -g mode-keys vi
set -g status-keys vi

# ---------- prefix: keep C-b ----------
# C-b h/j/k/l: move pane focus
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# C-b H/J/K/L: move the split boundary (resize by 5 cells)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# l/L are taken above; preserve the useful defaults under other keys.
bind Tab last-window
bind C-l switch-client -l

# r is more useful as reload; R keeps the old refresh-client.
# run-shell performs shell expansion, so a custom XDG_CONFIG_HOME works and
# the ~/.config fallback is used when XDG_CONFIG_HOME is unset.
bind r run-shell 'tmux source-file "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux.conf" && tmux display-message "tmux: reloaded"'
bind R refresh-client

# ---------- panes / windows ----------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind z resize-pane -Z

# ---------- copy mode / scrolling ----------
# 本阶段只保留滚动入口，不配置自定义选择/复制和系统剪贴板。
# 复制/粘贴后续单独章节统一设计。
# No dedicated PageUp/PageDown keys:
#   C-b [   enter copy mode
#   C-b u   enter copy mode and scroll up one page
#   C-u / C-d   half page
#   C-b / C-f   full page (inside copy mode)
#   g / G       top / bottom
bind [ copy-mode
bind u copy-mode -u

# 复制/粘贴暂不配置：移除选择/复制快捷键，只保留滚动。
unbind -T copy-mode-vi v
unbind -T copy-mode-vi V
unbind -T copy-mode-vi C-v
unbind -T copy-mode-vi y
unbind -T copy-mode-vi Space
unbind -T copy-mode-vi Enter
unbind -T copy-mode-vi MouseDragEnd1Pane

# ---------- status bar / theme (Catppuccin Mocha) ----------
set -g status-interval 5
set -g status-style "fg=#cdd6f4,bg=#1e1e2e"
set -g status-left-length 40
set -g status-right-length 40
set -g status-left "#[fg=#1e1e2e,bg=#cba6f7,bold] #S #[fg=#cba6f7,bg=#1e1e2e]"
set -g status-right "#[fg=#a6adc8,bg=#1e1e2e] %Y-%m-%d %H:%M "

setw -g window-status-separator ""
setw -g window-status-style "fg=#a6adc8,bg=#1e1e2e"
setw -g window-status-format " #I:#W "
setw -g window-status-current-style "fg=#1e1e2e,bg=#89b4fa,bold"
setw -g window-status-current-format " #I:#W "

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
set -g message-style "fg=#cdd6f4,bg=#313244"
set -g message-command-style "fg=#cdd6f4,bg=#313244"
set -g mode-style "fg=#1e1e2e,bg=#f9e2af"

# ---------- local overrides ----------
source-file -q ~/.tmux.local.conf
